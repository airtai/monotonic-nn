site_name: monotonic-nn (deprecated)
site_url: https://monotonic.airt.ai
site_description: Deprecated — now a compatibility shim over mononet
repo_name: airtai/monotonic-nn
repo_url: https://github.com/airtai/monotonic-nn

docs_dir: ../docs
site_dir: ../site

exclude_docs: |
  design/

theme:
  name: material

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false

markdown_extensions:
  - admonition
  - pymdownx.superfences

nav:
  - Home: index.md
  - "Experiments (archived)":
      - AutoMPG: experiments/AutoMPG.ipynb
      - Blog: experiments/Blog.ipynb
      - Compas: experiments/Compas.ipynb
      - Heart: experiments/Heart.ipynb
      - Loan: experiments/Loan.ipynb
